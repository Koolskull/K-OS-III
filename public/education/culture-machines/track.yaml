title: Culture Machines
slug: culture-machines
summary: >
  How subcultures, institutions, and markets co-produce culture that computers
  then scale. Injection versus bottom-up proliferation; Cacophony Society to
  Burning Man and SantaCon; Grateful Dead Acid Tests and academic LSD;
  jungle/CCRU/accelerationism; Michael Aquino, MindWar, Temple of Set, and the
  Presidio investigation (documented record versus internet narrative);
  commercial festival scale and claims that fail evidence checks. Follows
  EPISTEMIC_STANCE.md — primary sources first, named interpreters second,
  unsupported totalizing claims labeled as such.
