title: Fools for Christ — Holy Foolishness, Endurance, and Love on Display
slug: fools
summary: >-
  A careful track on the “fools for Christ” tradition from Paul through
  Byzantium and Russia to modern cases — holding together hagiographic,
  historical, and psychological readings without collapsing them. It follows
  the repo’s epistemic rules: named positions, cited sources, and visible
  disagreement. 🗣️ Owner’s frame (labeled): some saints were unusually
  enduring of bizarre experiences as a display of love; most readers are not
  called to humiliation or death but to build — creation before feeling.
prerequisites: [sovereignty]
estimated_hours: 3
flagship: false
