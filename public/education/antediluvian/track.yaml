title: Antediluvian Observatory
slug: antediluvian
summary: >
  Alternative theories about deep prehistory and the pre-flood era — Younger Dryas
  catastrophe, Göbekli Tepe and "founded" megaliths, flood myths, Plato's Atlantis,
  cross-continental parallels, occult readings of old maps, Watchers/Nephilim, and
  mud-flood claims. Observe, compare, and cite. Not a conversion track. Follows
  EPISTEMIC_STANCE: mainstream and dissenting accounts named; contradictions left visible.
  Channel-grounded expansions (Mr Mythos / Sepehr / Mind Unveiled / Jon Levi deep cuts)
  are planned as additional lessons once written.
