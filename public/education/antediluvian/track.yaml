title: Antediluvian Observatory
slug: antediluvian
summary: >
  Alternative theories about deep prehistory and the pre-flood era — Younger Dryas
  catastrophe, Göbekli Tepe, flood myths, Plato's Atlantis, coastal ruins, anomalous
  maps, Watchers/Nephilim, and mud-flood claims. Observe, compare, and cite. Not a
  conversion track. Follows EPISTEMIC_STANCE: mainstream and dissenting accounts
  named; contradictions left visible.
