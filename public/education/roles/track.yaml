title: Roles — Feminism, Tradition, and Adaptive Households
slug: roles
summary: >-
  A careful track on feminism and "traditional female roles": the mainstream
  accounts and credible dissenting accounts, what the historical record
  actually shows about women's labor, and how real households have always
  adapted roles to abilities and needs. The author's dictated voice is quoted
  verbatim (🗣️) and treated as an interpretive frame, not settled fact. Two
  doors (Christian and secular) are kept open, as in the creativity track.
prerequisites: [sovereignty]
estimated_hours: 3
flagship: false
