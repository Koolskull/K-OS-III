title: Antediluvian Observatory
slug: antediluvian
summary: >
  Expanded survey of alternative theories about deep prehistory and the pre-flood era,
  grounded in the specific claims and frameworks of Mr Mythos (Watchers, Enoch, Agartha,
  American giants), Robert Sepehr / Atlantean Gardens (hyperdiffusion, Atlantis as mother
  culture, Rh-negative markers, Hyperborea), Mind Unveiled and Jon Levi (Tartaria, mud
  flood, World's Fairs as rebranded capitals, star forts and EMF architecture, "found not
  founded"). Younger Dryas, Göbekli Tepe, flood parallels, occult maps. Observe every
  claim, cite sources, leave contradictions between timelines and mechanisms fully visible.
  Not a conversion track. Follows EPISTEMIC_STANCE.
prerequisites: []
estimated_hours: 28
flagship: false
