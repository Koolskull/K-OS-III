name: Build 2kool.tv /k-os export

# Manual or direct pushes to branch 2kool.tv.
# Normal master → 2kool flow is "Sync and build 2kool.tv" (includes the export).
# This workflow remains for re-building without a master push.

on:
  push:
    branches:
      - "2kool.tv"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-2kool-tv-manual
  cancel-in-progress: false

env:
  NEXT_PUBLIC_BASE_PATH: /k-os
  NEXT_PUBLIC_ASSET_BASE: ""
  NEXT_PUBLIC_GAMES_BASE: ""

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build static export
        env:
          K_OS_EXPORT: "true"
        run: npm run build

      - name: Patch CSS asset paths for basePath
        run: |
          set -e
          BP="${NEXT_PUBLIC_BASE_PATH}"
          find out -name "*.css" -print0 | xargs -0 -r sed -i "s|url(/fonts/|url(${BP}/fonts/|g"
          find out -name "*.css" -print0 | xargs -0 -r sed -i "s|url('/fonts/|url('${BP}/fonts/|g"
          find out -name "*.css" -print0 | xargs -0 -r sed -i "s|url(\"/fonts/|url(\"${BP}/fonts/|g"
          find out -name "*.css" -print0 | xargs -0 -r sed -i "s|url(/gifs/|url(${BP}/gifs/|g" || true

      - name: Add .nojekyll
        run: touch out/.nojekyll

      - name: Upload 2kool.tv export artifact
        uses: actions/upload-artifact@v4
        with:
          name: 2kool-tv-k-os
          path: out
          retention-days: 14
