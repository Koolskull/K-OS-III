name: Build 2kool.tv root export

# Manual rebuild of the domain-root static export for Apache/GCE.
# Primary path is "Sync and build 2kool.tv" on master push.

on:
  push:
    branches:
      - "2kool.tv"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-2kool-tv-manual
  cancel-in-progress: false

env:
  NEXT_PUBLIC_BASE_PATH: ""
  NEXT_PUBLIC_SITE_BRAND: "2kool"
  NEXT_PUBLIC_ASSET_BASE: ""
  NEXT_PUBLIC_GAMES_BASE: ""

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci --legacy-peer-deps
      - name: Build
        env:
          K_OS_EXPORT: "true"
        run: npm run build
      - name: Apache helpers
        run: |
          cat > out/.htaccess << 'HT'
          Options -Indexes
          <IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteBase /
            RewriteRule ^index\.html$ - [L]
            RewriteCond %{REQUEST_FILENAME} !-f
            RewriteCond %{REQUEST_FILENAME} !-d
            RewriteRule . /index.html [L]
          </IfModule>
          <Files "index.html">
            Header set Cache-Control "no-cache, no-store, must-revalidate"
          </Files>
          HT
          touch out/.nojekyll
      - uses: actions/upload-artifact@v4
        with:
          name: 2kool-tv-root
          path: out
          retention-days: 14
      - run: cd out && zip -r -q ../2kool-tv-root.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: 2kool-tv-root-zip
          path: 2kool-tv-root.zip
          retention-days: 14
