title: Creativity as the Way Out
slug: creativity
summary: >-
  Creativity as the accessible exit from trauma-shaped states — depression,
  laziness, imposter syndrome, hopelessness. Value as a function of reality
  (the Jekyll Island diagnostic: if it is real, it has value; if it is a
  facade, it will not maintain long-term value). Creativity as the primary
  objective function for long-term, exponential growth, from any worldview.
  Christian and secular readings converge. Ships teaching lessons AND
  offline learning tools — exercises, templates, and logs the reader can run
  without passing a checkout.
prerequisites: [sovereignty]
estimated_hours: 3
flagship: false
