name: Build 2kool.tv /k-os export

# Builds the same static export as GitHub Pages, but with BASE_PATH=/k-os
# for https://2kool.tv/k-os/ (or any host that mounts the app at /k-os).
#
# Always uploads the out/ folder as a downloadable Actions artifact.
# Optional deploy to an external 2kool.tv Pages repo runs only when
# repository secret TWOKOOL_DEPLOY_KEY is configured (see docs/DEPLOYMENT.md).

on:
  push:
    branches: ["2kool.tv"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-2kool-tv
  cancel-in-progress: false

env:
  # Shared path for 2kool.tv/k-os and koolskull.github.io/k-os style hosts
  NEXT_PUBLIC_BASE_PATH: /k-os
  NEXT_PUBLIC_ASSET_BASE: ""
  NEXT_PUBLIC_GAMES_BASE: ""

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build static export
        env:
          K_OS_EXPORT: "true"
        run: npm run build

      - name: Patch CSS asset paths for basePath
        if: env.NEXT_PUBLIC_BASE_PATH != ''
        run: |
          set -e
          BP="${NEXT_PUBLIC_BASE_PATH}"
          find out -name "*.css" -print0 | xargs -0 sed -i "s|url(/fonts/|url(${BP}/fonts/|g"
          find out -name "*.css" -print0 | xargs -0 sed -i "s|url('/fonts/|url('${BP}/fonts/|g"
          find out -name "*.css" -print0 | xargs -0 sed -i "s|url(\"/fonts/|url(\"${BP}/fonts/|g"
          find out -name "*.css" -print0 | xargs -0 sed -i "s|url(/gifs/|url(${BP}/gifs/|g" || true

      - name: Add .nojekyll
        run: touch out/.nojekyll

      - name: Upload 2kool.tv export artifact
        uses: actions/upload-artifact@v4
        with:
          name: 2kool-tv-k-os
          path: out
          retention-days: 14

      - name: Deploy to external 2kool.tv repo (optional)
        # Requires repo secret TWOKOOL_DEPLOY_KEY (deploy key with write to Koolskull/2kool.tv).
        # Skips cleanly when the secret is absent.
        if: ${{ secrets.TWOKOOL_DEPLOY_KEY != '' }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.TWOKOOL_DEPLOY_KEY }}
          external_repository: Koolskull/2kool.tv
          publish_branch: main
          publish_dir: ./out
          destination_dir: k-os
          commit_message: "deploy K-OS III to /k-os (incl. EDUCATION)"
