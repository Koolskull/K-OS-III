<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="author" content="2kool Productions LLC, Los Angeles, CA">
<meta name="copyright" content="2kool Productions LLC">
<title>Stardrain wiki</title>
<style>
  @font-face {
    font-family: "kongtext";
    src: url("../fonts/kongtext-webfont.woff2") format("woff2");
    font-display: block;
  }
  html {
    --u: 4px;
    -webkit-font-smoothing: none;
    text-rendering: optimizeSpeed;
  }
  html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
  body {
    --bg: #091a1f;
    --paper: #0b221d;
    --dim: #456254;
    --ink: #90b08e;
    --hi: #729277;
    position: fixed;
    inset: 0;
    width: 100%;
    margin: 0;
    min-height: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "kongtext", monospace;
    font-size: 16px;
    line-height: 1.4;
  }
  button, a, textarea { border-radius: 0; }
  a { color: var(--ink); }
  [hidden] { display: none !important; }
  .term {
    box-sizing: border-box;
    height: 100dvh;
    min-height: 0;
    display: grid;
    grid-template-columns: minmax(220px, 320px) 12px max-content 12px minmax(200px, 260px);
    grid-template-rows: auto minmax(0, 1fr) auto auto;
    grid-template-areas:
      "bar bar bar bar bar"
      "menu-l gutter-l screen gutter-r menu-r"
      "story story story story story"
      "hint hint hint hint hint";
    gap: 16px 0;
    padding: 16px;
    overflow: hidden;
  }
  .bar { grid-area: bar; display: flex; justify-content: space-between; gap: 16px; margin: 0; color: #d7ead2; font-size: 16px; line-height: 1.4; }
  .bar span:last-child { color: #8faf8c; font-size: 16px; text-align: right; }
  #menu-l { grid-area: menu-l; }
  .gutter-l { grid-area: gutter-l; }
  .screen { grid-area: screen; display: flex; justify-content: center; align-items: stretch; overflow: hidden; padding: 8px; min-height: 0; }
  .gutter-r { grid-area: gutter-r; }
  #menu-r { grid-area: menu-r; }
  .cell { box-sizing: border-box; min-width: 0; min-height: 0; border: 2px solid var(--dim); background: var(--bg); }
  .gutter {
    box-sizing: border-box;
    align-self: stretch;
    border-left: 2px solid var(--dim);
    border-right: 2px solid var(--dim);
    background: repeating-linear-gradient(to bottom, var(--paper) 0 4px, var(--dim) 4px 6px);
  }
  .menu { display: flex; flex-direction: column; align-items: stretch; box-sizing: border-box; gap: 0; overflow: auto; overscroll-behavior: contain; touch-action: pan-y; padding: 8px; border: 2px solid var(--dim); background: var(--bg); }
  .menu .trunk::before { content: "+ "; }
  .menu .kids > .leaf::before, .menu .kids > .rank-1::before, .menu .kids > .rank-2::before, .menu .kids > a::before { content: "+- "; }
  .menu .kids > .leaf:last-child::before, .menu .kids > .rank-1:last-child::before, .menu .kids > .rank-2:last-child::before, .menu .kids > a:last-child::before { content: "\\- "; }
  .story, .hint { margin: 0; }
  .story { grid-area: story; color: #d7ead2; font-size: 16px; line-height: 1.6; }
  .hint { grid-area: hint; color: #8faf8c; font-size: 16px; line-height: 1.6; }
  .menu button, .menu a {
    appearance: none;
    display: block;
    box-sizing: border-box;
    width: 100%;
    min-width: 0;
    max-width: 100%;
    margin: 0;
    border-radius: 0;
    font-family: "kongtext", monospace;
    text-decoration: none;
    text-align: left;
    white-space: pre;
    overflow-wrap: normal;
    flex: 0 0 auto;
  }
  button.trunk, p.trunk {
    margin: 8px 0 0;
    padding: 8px;
    border: 2px solid var(--hi);
    background: var(--paper);
    color: var(--hi);
    font-size: 8px;
    line-height: 1.6;
  }
  .menu > button.trunk:first-child, .menu > p.trunk:first-child { margin-top: 0; }
  button.trunk.rank-3, p.trunk.rank-3 {
    margin-top: 12px;
    border: 2px solid var(--dim);
    background: transparent;
    color: var(--dim);
    font-size: 8px;
    line-height: 1.6;
  }
  .kids { display: flex; flex-direction: column; align-items: stretch; gap: 0; margin: 0 0 0 10px; padding: 2px 0 2px 8px; border-left: 2px solid var(--dim); }
  .leaf { padding: 4px; border: 0; background: transparent; color: var(--ink); font-size: 8px; line-height: 1.8; }
  .kids-quiet .leaf { color: var(--dim); }
  button.rank-1 { margin: 6px 0; padding: 8px; border: 2px solid var(--hi); background: var(--hi); color: var(--bg); font-size: 16px; line-height: 1.4; }
  button.rank-2 { margin: 6px 0; padding: 8px; border: 2px solid var(--hi); background: transparent; color: var(--ink); font-size: 8px; line-height: 1.6; }
  button.rank-3, a.rank-3 { margin: 6px 0; padding: 8px; border: 2px solid var(--dim); background: transparent; color: var(--dim); font-size: 8px; line-height: 1.6; }
  .menu .is-here { background: var(--hi); color: var(--bg); border-color: var(--hi); }
  .menu .is-open { color: #d7ead2; border-color: var(--hi); }
  .menu button:focus-visible, .menu a:focus-visible { outline: 2px solid var(--hi); outline-offset: 2px; }
  .gb {
    position: relative;
    box-sizing: border-box;
    width: calc(160 * var(--u));
    max-width: 100%;
    height: 100%;
    min-height: 0;
    background: #091a1f;
    overflow: auto;
    overscroll-behavior: contain;
    touch-action: pan-y;
    border: calc(var(--u)) solid var(--dim);
  }
  .sheet { padding: 16px; }
  .sheet button {
    appearance: none;
    display: block;
    width: 100%;
    box-sizing: border-box;
    margin: 0 0 20px;
    padding: 14px 12px;
    border: 2px solid var(--dim);
    background: transparent;
    color: var(--ink);
    font: 8px/1.6 "kongtext", monospace;
    text-align: left;
    min-height: 44px;
    overflow-wrap: break-word;
  }
  button.is-on { color: var(--bg); background: var(--hi); border-color: var(--hi); }
  button.is-on::before { content: ""; }
  .label { color: #8faf8c; font-size: 16px; line-height: 1.6; text-transform: uppercase; overflow-wrap: break-word; }
  h1, h2 { margin: 0 0 16px; color: #d7ead2; font: 16px/1.4 "kongtext", monospace; font-weight: normal; }
  p { margin: 0 0 16px; color: #d7ead2; line-height: 1.6; overflow-wrap: break-word; }
  textarea {
    display: block;
    width: 100%;
    box-sizing: border-box;
    min-height: 180px;
    margin: 0 0 8px;
    padding: 8px;
    border: 2px solid var(--dim);
    background: var(--paper);
    color: var(--ink);
    font: 16px/1.4 "kongtext", monospace;
    resize: vertical;
  }
  .pad { display: none; }
  button[data-act] {
    width: 44px;
    height: 44px;
    padding: 0;
    background: var(--bg);
    color: var(--ink);
    border: 2px solid var(--dim);
    font: 8px "kongtext", monospace;
  }
  @media (max-width: 1120px) {
    .term {
      height: 100dvh;
      min-height: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 12px;
    }
    .bar, .screen, #menu-l, #menu-r, .story, .hint {
      width: 100%;
      max-width: 100%;
      min-width: 0;
    }
    .bar, .story, .hint { flex: 0 0 auto; }
    .bar { order: 1; }
    .screen { order: 2; flex: 1.4 1 0; min-height: 0; overflow: hidden; }
    .story { order: 3; }
    .hint { order: 4; }
    #menu-l { order: 5; }
    #menu-r { order: 6; }
    .gutter { display: none; }
    #menu-l, #menu-r {
      display: flex;
      flex: 1 1 0;
      flex-direction: column;
      align-items: stretch;
      min-height: 0;
      max-height: none;
      overflow: auto;
      overscroll-behavior: contain;
      touch-action: pan-y;
    }
    #menu-r { gap: 28px; padding: 0; border: 0; background: transparent; }
    #menu-r .trunk::before, #menu-r .kids > .leaf::before, #menu-r .kids > .rank-1::before, #menu-r .kids > .rank-2::before, #menu-r .kids > a::before { content: none; }
    #menu-r .trunk, #menu-r .trunk.rank-3 { margin: 0; padding: 0; border: 0; background: transparent; color: var(--dim); font-size: 8px; }
    #menu-r .kids { gap: 20px; margin: 0; padding: 0; border: 0; }
    #menu-r .leaf, #menu-r button.rank-2, #menu-r button.rank-3, #menu-r a.rank-3 {
      margin: 0;
      padding: 14px 12px;
      min-height: 44px;
      border: 2px solid var(--dim);
      background: transparent;
      color: var(--ink);
      font-size: 8px;
      line-height: 1.6;
      white-space: normal;
    }
    #menu-r button.rank-1 { margin: 0; min-height: 44px; font-size: 8px; }
  }
  @media (max-width: 720px) {
    html { --u: 2px; }
    .term { height: 100dvh; min-height: 0; overflow: hidden; padding-bottom: 120px; }
    #menu-l, #menu-r { display: flex; }
    .screen { min-height: 0; overflow: hidden; }
    .screen .gb {
      width: 100%;
      height: 100%;
      max-height: none;
      min-height: 0;
      overflow: auto;
    }
    .hint { display: none; }
    .pad {
      display: grid;
      position: fixed;
      left: 8px;
      right: 8px;
      bottom: 8px;
      z-index: 4;
      grid-template-columns: 44px 44px 44px 1fr 44px 44px;
      grid-template-areas: ". up . . b a" "left down right . b a";
      gap: 6px;
    }
    button[data-act="up"] { grid-area: up; }
    button[data-act="down"] { grid-area: down; }
    button[data-act="left"] { grid-area: left; }
    button[data-act="right"] { grid-area: right; }
    button[data-act="b"] { grid-area: b; }
    button[data-act="a"] { grid-area: a; }
    body[data-editing="on"] .pad { display: none; }
    body[data-editing="on"] .term { padding-bottom: 16px; }
  }
</style>
</head>
<body data-page="island" data-theme="dmg" data-crt="on">
<div class="term">
  <p class="bar">
    <span>STARDRAIN</span>
    <span id="where">WIKI</span>
  </p>
  <nav class="menu tree" id="menu-l" aria-label="Tracts"></nav>
  <div class="gutter gutter-l" aria-hidden="true"></div>
  <div class="cell screen">
    <div class="gb" id="gb"><div class="sheet" id="screen"></div></div>
  </div>
  <div class="gutter gutter-r" aria-hidden="true"></div>
  <nav class="menu" id="menu-r" aria-label="Commands"></nav>
  <p class="story label" id="status" role="status"></p>
  <p class="hint">ARROWS MOVE   A OPEN   B BACK</p>
</div>
<div class="pad" aria-hidden="true">
  <button type="button" data-act="up">U</button>
  <button type="button" data-act="down">D</button>
  <button type="button" data-act="left">L</button>
  <button type="button" data-act="right">R</button>
  <button type="button" data-act="b">B</button>
  <button type="button" data-act="a">A</button>
</div>
<script type="module" src="./desk.js"></script>
<script type="module" src="/assets/crt.js"></script>
</body>
</html>
